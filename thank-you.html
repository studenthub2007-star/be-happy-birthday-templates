<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You ❤️ | BE HAPPY</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0d0911;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .thank-you {
            width: 100%;
            max-width: 600px;
            padding: 50px 30px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,79,145,0.25);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .heart {
            font-size: 70px;
            margin-bottom: 20px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #ff4f91;
        }

        p {
            color: #aaa;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4f91, #ff2f70);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,79,145,0.35);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .thank-you {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <div class="heart">❤️</div>

        <h1>Thank You <span>❤️</span></h1>

        <p>
            Your birthday template enquiry has been received!
            <br><br>
            BE HAPPY will contact you soon.
        </p>

        <a
            href="index.html"
            class="back-button"
        >
            Back to BE HAPPY 🏠
        </a>

    </div>

</body>
</html>
